name: Build and dispatch

# Drop into an app repo's .github/workflows/ directory.
#
# On every push to main: validates the suite and publishes a Docker image to
# GHCR with both :latest and :sha-<commit> tags. Production deployment remains
# an explicit manual action so a source-branch promotion can never race a
# campaign-data cutover. A manual run validates without publishing or deploying
# unless publishing or a deployment target is explicitly enabled; selecting a
# deployment target publishes first and dispatches that exact image digest.
#
# Required configuration in the app repo (Settings → Secrets and variables → Actions):
#   Secret   INFRA_DISPATCH_TOKEN   fine-grained PAT for the infra repo
#   Variable INFRA_REPO             owner/infra-repo (e.g. pjunak/junak.eu)
#   Variable INFRA_SERVICE          manual `configured` target list. May be a
#                                   space/comma-separated list such as
#                                   "tiamat asurai"; each becomes one dispatch.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the image when no deployment target is selected
        required: true
        type: boolean
        default: false
      deploy_target:
        description: Deploy one instance, or use the configured target list
        required: true
        type: choice
        options:
          - none
          - asurai
          - tiamat
          - configured
        default: none

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - run: npm ci
      - run: npm run check

  build:
    name: Build image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.build_image.outputs.digest && format('{0}@{1}', steps.img.outputs.name, steps.build_image.outputs.digest) || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' || inputs.publish || inputs.deploy_target != 'none' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: img
        env:
          REPO: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPO,,}" >> "$GITHUB_OUTPUT"

      - name: Build image
        id: build_image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' || inputs.publish || inputs.deploy_target != 'none' }}
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # INFRA_SERVICE may be one service or a list ("tiamat asurai"). Resolve it to
  # a JSON array so the dispatch job can fan out one deploy per service — the
  # infra deploy workflow takes a single service per event and serialises runs,
  # so N events redeploy N stacks safely from one image push.
  resolve-targets:
    name: Resolve deploy targets
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target != 'none' }}
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.list.outputs.services }}
    steps:
      - name: Parse INFRA_SERVICE into a JSON array
        id: list
        env:
          TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          REPO: ${{ vars.INFRA_REPO }}
          SERVICE: ${{ vars.INFRA_SERVICE }}
          TARGET: ${{ inputs.deploy_target }}
        run: |
          set -euo pipefail
          : "${TOKEN:?INFRA_DISPATCH_TOKEN secret is not set}"
          : "${REPO:?INFRA_REPO variable is not set (e.g. owner/infra-repo)}"
          if [[ "${TARGET:-}" == asurai || "${TARGET:-}" == tiamat ]]; then
            services=$(jq -nc --arg service "$TARGET" '[$service]')
          else
            : "${SERVICE:?INFRA_SERVICE variable is not set (e.g. tiamat, or a list: tiamat asurai)}"
            # Split on commas and/or any whitespace; drop empties.
            services=$(printf '%s' "$SERVICE" | jq -Rsc 'split("[,\\s]+";"") | map(select(length > 0))')
          fi
          if [[ "$services" == "[]" ]]; then
            echo "::error::INFRA_SERVICE parsed to an empty list"
            exit 1
          fi
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "Deploy targets: $services"

  dispatch:
    name: Dispatch deploy (${{ matrix.service }})
    needs: [build, resolve-targets]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.resolve-targets.outputs.services) }}
    steps:
      - name: Trigger infra deploy
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          repository: ${{ vars.INFRA_REPO }}
          event-type: deploy
          client-payload: |-
            {
              "service": "${{ matrix.service }}",
              "sha": "${{ github.sha }}",
              "image_ref": "${{ needs.build.outputs.image_ref }}"
            }
