name: Build and dispatch

# On every push to main: validates the suite and builds a Docker image. It
# publishes :latest and :sha-<commit> only after the product-parity release gate
# passes. Production deployment remains an explicit manual action so a source-
# branch promotion can never race a campaign-data cutover. A manual run validates
# without publishing or deploying unless publishing or a deployment target is
# explicitly enabled; selecting a deployment target publishes first and
# dispatches that exact image digest.
#
# Required configuration in the app repo (Settings → Secrets and variables → Actions):
#   Secret   INFRA_DISPATCH_TOKEN   infra Contents: write and Actions: read
#   Variable INFRA_REPO             owner/infra-repo (e.g. pjunak/junak.eu)
#   Variable INFRA_SERVICE          manual `configured` target list. May be a
#                                   space/comma-separated list such as
#                                   "tiamat asurai"; each becomes one dispatch.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the image when no deployment target is selected
        required: true
        type: boolean
        default: false
      deploy_target:
        description: Deploy one instance, or use the configured target list
        required: true
        type: choice
        options:
          - none
          - asurai
          - tiamat
          - configured
        default: none

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  compatibility:
    uses: ./.github/workflows/addon-compatibility.yml
    secrets: inherit

  test:
    name: Run test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check

  build:
    name: Build image
    needs: [test, compatibility]
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.publish_image.outputs.digest && format('{0}@{1}', steps.img.outputs.name, steps.publish_image.outputs.digest) || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: docker/setup-buildx-action@v4

      - name: Inspect product release readiness
        id: release_readiness
        shell: bash
        run: |
          set +e
          node scripts/check-release-readiness.mjs
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker publication is disabled until the product-parity gate passes."
          fi

      - name: Refuse an explicitly requested incomplete release
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.deploy_target != 'none') && steps.release_readiness.outputs.ready != 'true' }}
        run: |
          echo "::error::Publish or deployment was requested while product parity is incomplete."
          exit 1

      - name: Log in to GHCR
        if: ${{ steps.release_readiness.outputs.ready == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.publish || inputs.deploy_target != 'none')) }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: img
        env:
          REPO: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPO,,}" >> "$GITHUB_OUTPUT"

      - name: Build image for startup verification
        id: build_image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha

      - name: Verify packaged runtime starts as its production user
        env:
          IMAGE: ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          trap 'docker rm -f codex-image-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name codex-image-smoke --network none \
            -e CODEX_DM_PASSWORD=ci-image-smoke-only "$IMAGE"
          for attempt in {1..30}; do
            if docker exec codex-image-smoke /app/codex-health http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs codex-image-smoke
          echo '::error::Packaged runtime did not become healthy'
          exit 1

      - name: Publish the verified warm build
        id: publish_image
        if: ${{ steps.release_readiness.outputs.ready == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.publish || inputs.deploy_target != 'none')) }}
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record published release identity
        if: ${{ steps.release_readiness.outputs.ready == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.publish || inputs.deploy_target != 'none')) }}
        env:
          IMAGE_REF: ${{ steps.img.outputs.name }}@${{ steps.publish_image.outputs.digest }}
        run: |
          mkdir -p release
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync("release/release.json", JSON.stringify({repository:process.env.GITHUB_REPOSITORY, sha:process.env.GITHUB_SHA, run_id:process.env.GITHUB_RUN_ID, image_ref:process.env.IMAGE_REF}));'

      - uses: actions/upload-artifact@v7
        if: ${{ steps.release_readiness.outputs.ready == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.publish || inputs.deploy_target != 'none')) }}
        with:
          name: release-metadata
          path: release/release.json
          retention-days: 90
          if-no-files-found: error

  # INFRA_SERVICE may be one service or a list ("tiamat asurai"). Resolve it to
  # a JSON array so the dispatch job can fan out one deploy per service — the
  # infra deploy workflow takes a single service per event and serialises runs,
  # so N events redeploy N stacks safely from one image push.
  resolve-targets:
    name: Resolve deploy targets
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_target != 'none' }}
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.list.outputs.services }}
    steps:
      - name: Parse INFRA_SERVICE into a JSON array
        id: list
        env:
          TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          REPO: ${{ vars.INFRA_REPO }}
          SERVICE: ${{ vars.INFRA_SERVICE }}
          TARGET: ${{ inputs.deploy_target }}
        run: |
          set -euo pipefail
          : "${TOKEN:?INFRA_DISPATCH_TOKEN secret is not set}"
          : "${REPO:?INFRA_REPO variable is not set (e.g. owner/infra-repo)}"
          if [[ "${TARGET:-}" == asurai || "${TARGET:-}" == tiamat ]]; then
            services=$(jq -nc --arg service "$TARGET" '[$service]')
          else
            : "${SERVICE:?INFRA_SERVICE variable is not set (e.g. tiamat, or a list: tiamat asurai)}"
            # Split on commas and/or any whitespace; drop empties.
            services=$(printf '%s' "$SERVICE" | jq -Rsc 'split("[,\\s]+";"") | map(select(length > 0))')
          fi
          services=$(jq -c 'unique' <<<"$services")
          if ! jq -e 'length > 0 and all(.[]; . == "asurai" or . == "tiamat")' <<<"$services" >/dev/null; then
            echo "::error::INFRA_SERVICE must contain only asurai and/or tiamat"
            exit 1
          fi
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "Deploy targets: $services"

  dispatch:
    name: Deploy and verify (${{ matrix.service }})
    timeout-minutes: 35
    needs: [build, resolve-targets]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.resolve-targets.outputs.services) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Deploy and wait for infrastructure health
        run: node scripts/deploy-release.mjs
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          INFRA_REPO: ${{ vars.INFRA_REPO }}
          DEPLOY_TARGET: ${{ matrix.service }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_IMAGE: ${{ needs.build.outputs.image_ref }}
