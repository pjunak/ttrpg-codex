name: Build and dispatch

# Main pushes validate, publish an immutable image, and deploy every configured
# campaign. Manual runs are check-only unless publication/deployment is selected.
# Required Actions configuration:
#   INFRA_DISPATCH_TOKEN: fine-grained token for infra, Contents write + Actions read
#   INFRA_REPO: owner/infra-repo
#   INFRA_SERVICE: space/comma-separated targets; use "asurai tiamat" for both sites.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the image when no deployment target is selected
        required: true
        type: boolean
        default: false
      deploy_target:
        description: Deploy one instance, or use the configured target list
        required: true
        type: choice
        options:
          - none
          - asurai
          - tiamat
          - configured
        default: none

permissions:
  contents: read
  packages: write

concurrency:
  # Share the release queue with Deploy published release. A newer push must
  # never cancel a workflow that has already asked infrastructure to deploy.
  # PRs use independent groups and do not hold the production queue.
  group: ${{ github.event_name == 'pull_request' && format('check-{0}', github.run_id) || 'codex-production-release' }}
  cancel-in-progress: false
  queue: max

jobs:
  compatibility:
    uses: ./.github/workflows/addon-compatibility.yml
    with:
      require_private: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.deploy_target != 'none') }}
    secrets: inherit

  test:
    name: Run test suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - run: npm ci
      - run: node --test .github/scripts/workflow-policy.test.mts
      - run: npx playwright install --with-deps chromium
      - run: npm run check

  build:
    name: Build image
    needs: [test, compatibility, resolve-targets]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      image_ref: ${{ steps.publish_image.outputs.digest && format('{0}@{1}', steps.img.outputs.name, steps.publish_image.outputs.digest) || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: docker/setup-buildx-action@v4

      - name: Inspect product release readiness
        id: release_readiness
        shell: bash
        run: |
          set +e
          node scripts/check-release-readiness.mts
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker publication is disabled until the product-parity gate passes."
          fi

      - name: Refuse an incomplete release
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.deploy_target != 'none')) && steps.release_readiness.outputs.ready != 'true' }}
        run: |
          echo "::error::Publish or deployment was requested while product parity is incomplete."
          exit 1

      - name: Check automatic release is still current
        id: current
        if: github.event_name == 'push'
        run: node scripts/deploy-release.mts current
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.sha }}

      - name: Log in to GHCR
        if: ${{ steps.current.outputs.current != 'false' && steps.release_readiness.outputs.ready == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.publish || inputs.deploy_target != 'none')) }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: img
        env:
          REPO: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPO,,}" >> "$GITHUB_OUTPUT"

      - name: Build image for startup verification
        id: build_image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Verify packaged runtime starts as its production user
        env:
          IMAGE: ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          trap 'docker rm -f codex-image-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name codex-image-smoke --network none \
            -e CODEX_DM_PASSWORD=ci-image-smoke-only "$IMAGE"
          for attempt in {1..30}; do
            if docker exec codex-image-smoke /app/codex-health http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs codex-image-smoke
          echo '::error::Packaged runtime did not become healthy'
          exit 1

      - name: Publish the verified warm build
        id: publish_image
        if: ${{ steps.current.outputs.current != 'false' && steps.release_readiness.outputs.ready == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.publish || inputs.deploy_target != 'none')) }}
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha

      - name: Record published release identity
        if: ${{ steps.current.outputs.current != 'false' && steps.release_readiness.outputs.ready == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.publish || inputs.deploy_target != 'none')) }}
        env:
          IMAGE_REF: ${{ steps.img.outputs.name }}@${{ steps.publish_image.outputs.digest }}
        run: |
          mkdir -p release
          node scripts/write-release-metadata.mts

      - uses: actions/upload-artifact@v7
        if: ${{ steps.current.outputs.current != 'false' && steps.release_readiness.outputs.ready == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.publish || inputs.deploy_target != 'none')) }}
        with:
          name: release-metadata
          path: release/release.json
          retention-days: 90
          if-no-files-found: error

  # Run before the image build so missing/expired credentials fail early.
  # Non-deployment runs complete this job without receiving deployment secrets.
  resolve-targets:
    name: Check deployment configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.list.outputs.services }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Resolve targets and verify infrastructure access
        id: list
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' && inputs.deploy_target != 'none') }}
        run: node scripts/deploy-release.mts prepare
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          INFRA_REPO: ${{ vars.INFRA_REPO }}
          INFRA_SERVICE: ${{ vars.INFRA_SERVICE }}
          DEPLOY_TARGET: ${{ github.event_name == 'push' && 'configured' || inputs.deploy_target }}

  dispatch:
    name: Deploy and verify (${{ matrix.service }})
    timeout-minutes: 35
    needs: [build, resolve-targets]
    if: ${{ needs.build.outputs.image_ref != '' && needs.resolve-targets.outputs.services != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.resolve-targets.outputs.services) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Deploy and wait for infrastructure health
        run: node scripts/deploy-release.mts
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          INFRA_REPO: ${{ vars.INFRA_REPO }}
          DEPLOY_TARGET: ${{ matrix.service }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_IMAGE: ${{ needs.build.outputs.image_ref }}
