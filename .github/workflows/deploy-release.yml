name: Deploy published release
run-name: Deploy published build ${{ inputs.source_run_id }} to ${{ inputs.target }}

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful main Build and dispatch run ID containing release-metadata
        required: true
        type: string
      target:
        description: Campaign to deploy
        required: true
        type: choice
        options: [asurai, tiamat]

permissions:
  contents: read
  actions: read

concurrency:
  group: release-deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          name: release-metadata
          path: release
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Verify release provenance
        id: release
        run: node scripts/deploy-release.mts verify
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      - name: Deploy and wait for infrastructure health
        run: node scripts/deploy-release.mts
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          INFRA_REPO: ${{ vars.INFRA_REPO }}
          DEPLOY_TARGET: ${{ inputs.target }}
          DEPLOY_SHA: ${{ steps.release.outputs.sha }}
          DEPLOY_IMAGE: ${{ steps.release.outputs.image_ref }}
