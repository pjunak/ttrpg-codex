name: Addon compatibility

on:
  workflow_call:
    inputs:
      require_private:
        description: Require the private compendium and installed suite before publication
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: addon-compatibility-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  companions:
    name: Build, inspect and exercise installed companions
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Resolve private coverage
        id: coverage
        env:
          ADDON_SUITE_TOKEN: ${{ secrets.ADDON_SUITE_TOKEN }}
          REQUIRED: ${{ inputs.require_private }}
        run: |
          if [[ -n "$ADDON_SUITE_TOKEN" ]]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          elif [[ "$REQUIRED" == true ]]; then
            echo '::error::Publication requires ADDON_SUITE_TOKEN and the complete installed companion suite.'
            exit 1
          else
            echo "mode=public" >> "$GITHUB_OUTPUT"
            echo '::warning::Private content is unavailable. This public-only run cannot establish publication coverage.'
          fi

      - uses: actions/checkout@v7
        with:
          path: ttrpg-codex
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: pjunak/addon-dm-tools
          path: addon-dm-tools
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: pjunak/addon-dnd-engine
          path: addon-dnd-engine
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: pjunak/addon-dnd-character-sheets
          path: addon-dnd-character-sheets
          persist-credentials: false

      - uses: actions/checkout@v7
        if: steps.coverage.outputs.mode == 'full'
        with:
          repository: pjunak/addon-dnd-2024-compendium
          token: ${{ secrets.ADDON_SUITE_TOKEN }}
          path: addon-dnd-2024-compendium
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: ttrpg-codex/.nvmrc
          cache: npm
          cache-dependency-path: |
            ttrpg-codex/package-lock.json
            addon-dm-tools/package-lock.json
            addon-dnd-character-sheets/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version-file: ttrpg-codex/go.mod
          cache: true
          cache-dependency-path: |
            ttrpg-codex/go.sum
            addon-*/go.sum

      - name: Install host and browser dependencies
        run: npm ci && npx playwright install --with-deps chromium
        working-directory: ttrpg-codex

      - name: Test and package DM Tools against the candidate host
        run: npm ci && npm run check && go test ./... && go vet ./... && go run ./cmd/build-package
        working-directory: addon-dm-tools

      - name: Test and package D&D Engine against the candidate host
        run: go test ./... && go vet ./... && go run ./cmd/build-package
        working-directory: addon-dnd-engine

      - name: Test and package Character Sheets against the candidate host
        run: npm ci && npm run package && npm test && go test ./... && go vet ./...
        working-directory: addon-dnd-character-sheets

      - name: Test and package Compendium against the candidate host
        if: steps.coverage.outputs.mode == 'full'
        run: npm ci && npm run package && npm run typecheck:tools && npm test
        working-directory: addon-dnd-2024-compendium

      - name: Inspect exact built ZIPs and record source provenance
        env:
          SUITE_MODE: ${{ steps.coverage.outputs.mode }}
        run: |
          repositories=(../addon-dm-tools ../addon-dnd-engine ../addon-dnd-character-sheets)
          if [[ "$SUITE_MODE" == full ]]; then
            repositories+=(../addon-dnd-2024-compendium)
          fi
          node scripts/companion-suite.mts prepare "${repositories[@]}"
        working-directory: ttrpg-codex

      - name: Build host UI and run installed companion acceptance
        env:
          SUITE_MODE: ${{ steps.coverage.outputs.mode }}
        run: npm --workspace @ttrpg-codex/frontend run build && node scripts/companion-suite.mts test "$SUITE_MODE"
        working-directory: ttrpg-codex

      # Private package contents stay in this job, never in public artifacts.
      - name: Preserve exact commit and inspected-hash evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: companion-provenance
          path: ttrpg-codex/release/companions/provenance.json
          if-no-files-found: ignore
