name: Addon compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: addon-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-addons:
    name: Public addon suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: ttrpg-codex

      - uses: actions/checkout@v7
        with:
          repository: pjunak/addon-dm-tools
          path: addon-dm-tools

      - uses: actions/checkout@v7
        with:
          repository: pjunak/addon-dnd-engine
          path: addon-dnd-engine

      - uses: actions/checkout@v7
        with:
          repository: pjunak/addon-dnd-character-sheets
          path: addon-dnd-character-sheets

      - uses: actions/setup-node@v7
        with:
          node-version-file: ttrpg-codex/.nvmrc

      - uses: actions/setup-go@v6
        with:
          go-version-file: ttrpg-codex/go.mod
          cache: true

      - name: Test DM Tools against this host revision
        run: npm ci && npm run check && go test ./... && go vet ./... && go run ./cmd/build-package
        working-directory: addon-dm-tools

      - name: Test D&D Engine against this host revision
        run: go test ./... && go vet ./... && go run ./cmd/build-package
        working-directory: addon-dnd-engine

      - name: Test Character Sheets against this host revision
        run: npm ci && npm run check && npm run package
        working-directory: addon-dnd-character-sheets

      - name: Inspect public release packages
        run: |
          go run ./cmd/codex-addon-inspect ../addon-dm-tools/dist/dm-tools-3.0.0.zip
          go run ./cmd/codex-addon-inspect ../addon-dnd-engine/dist/dnd-engine-3.0.0.zip
          go run ./cmd/codex-addon-inspect ../addon-dnd-character-sheets/dist/dnd-sheets-3.0.0.zip
        working-directory: ttrpg-codex

  private-compendium:
    name: Private compendium suite
    runs-on: ubuntu-latest
    env:
      ADDON_SUITE_TOKEN: ${{ secrets.ADDON_SUITE_TOKEN }}
    steps:
      - name: Report unavailable private suite
        if: env.ADDON_SUITE_TOKEN == ''
        run: echo "::warning::ADDON_SUITE_TOKEN is not configured; skipping the private compendium compatibility suite."

      - uses: actions/checkout@v7
        if: env.ADDON_SUITE_TOKEN != ''
        with:
          path: ttrpg-codex

      - uses: actions/checkout@v7
        if: env.ADDON_SUITE_TOKEN != ''
        with:
          repository: pjunak/addon-dnd-2024-compendium
          token: ${{ env.ADDON_SUITE_TOKEN }}
          path: addon-dnd-2024-compendium

      - uses: actions/setup-node@v7
        if: env.ADDON_SUITE_TOKEN != ''
        with:
          node-version-file: ttrpg-codex/.nvmrc

      - uses: actions/setup-go@v6
        if: env.ADDON_SUITE_TOKEN != ''
        with:
          go-version-file: ttrpg-codex/go.mod
          cache: true

      - name: Test Compendium against this host revision
        if: env.ADDON_SUITE_TOKEN != ''
        run: npm ci && npm run check && npm run package
        working-directory: addon-dnd-2024-compendium

      - name: Inspect private release package
        if: env.ADDON_SUITE_TOKEN != ''
        run: go run ./cmd/codex-addon-inspect ../addon-dnd-2024-compendium/dist/dnd-2024-compendium-3.0.0.zip
        working-directory: ttrpg-codex
