name: Publish tested add-on
description: Publish the already inspected package as a durable commit release.
inputs:
  artifact:
    description: Artifact containing exactly one inspected add-on ZIP
    default: reviewed-package
  packs-artifact:
    description: >-
      Optional artifact of inspected language packs built for that package by
      codex-addon-inspect -build-packs; each is published beside it
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: '26'
    - uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/tested-addon-package
    - if: inputs.packs-artifact != ''
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.packs-artifact }}
        path: ${{ runner.temp }}/tested-addon-packs
    - name: Publish the tested commit
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PUBLISHER_PATH: ${{ github.action_path }}
        PACKAGE_DIRECTORY: ${{ runner.temp }}/tested-addon-package
        PACKS_DIRECTORY: ${{ inputs.packs-artifact != '' && format('{0}/tested-addon-packs', runner.temp) || '' }}
      run: node "$PUBLISHER_PATH/publish.mts"
