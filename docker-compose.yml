services:
  ttrpg-codex:
    build: .
    container_name: ttrpg-codex
    volumes:
      - ./data:/app/data
    environment:
      - CODEX_DM_PASSWORD=${CODEX_DM_PASSWORD:?set CODEX_DM_PASSWORD in .env}
      - CODEX_PLAYER_PASSWORD=${CODEX_PLAYER_PASSWORD:-}
    command:
      - /app/codex
      - -listen
      - 0.0.0.0:3000
      - -data-dir
      - /app/data
      - -web-dir
      - /app/frontend
      - -secure-cookies=${CODEX_SECURE_COOKIES:-false}
      - -locale=${CODEX_LOCALE:-en}
      - -time-zone=${CODEX_TIME_ZONE:-Europe/Prague}
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 0.5
    restart: unless-stopped
    networks:
      - proxy

networks:
  proxy:
    external: true
