<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text rendering contract</title>
  <link rel="stylesheet" href="../../web/css/bundle.css">
  <style>
    body { padding: 2rem; background: var(--bg-base); }
    #cloud-layer { --cm-z: 1; --cm-type-z: 1; position: relative; }
    .fixture-edge { position: absolute; left: 240px; top: 40px; }
  </style>
</head>
<body>
  <main id="cloud-layer" data-cm-detail="full">
    <div class="fixture-card">
      <article class="cm-cloud" style="--cc:#c8a040;--cw:168px">
        <div class="cm-strip">Character</div>
        <div class="cm-name">Untitled explorer</div>
        <div class="cm-divider"></div>
        <div class="cm-fact">No concise summary has been added.</div>
      </article>
      <article class="cm-cloud cm-faction-hub" style="--cc:#c8a040;--cw:210px">
        <div class="cm-name" data-cm-text-role="hub-name">Faction title</div>
      </article>
    </div>
    <div class="cm-edge-label fixture-edge" style="transform:translate(12px, 8px) rotate(12deg)"></div>
  </main>
  <script type="module">
    import {
      clearTextLayoutCache,
      layoutText,
      onTextLayoutInvalidated,
    } from '../../web/js/text-layout.js';
    import {
      CLOUDMAP_EDGE_LABEL_FONT,
      CLOUDMAP_EDGE_LABEL_LETTER_SPACING,
    } from '../../web/js/cloudmap-text-style.js';
    import {
      cloudMapDetailLevel,
      cloudMapTypographyScale,
    } from '../../web/js/cloudmap-detail.js';
    import { layoutCloudMapText } from '../../web/js/cloudmap-text-style.js';

    const nextFrame = () => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    const closeTo = (actual, expected, tolerance = 0.06) => Math.abs(actual - expected) <= tolerance;
    const pixelValue = (element, property) => Number.parseFloat(getComputedStyle(element)[property]);
    const normalizedFontFamily = value => String(value).replace(/[\s"]/g, '').toLowerCase();
    const transformScale = element => {
      const value = getComputedStyle(element).transform;
      if (value === 'none') return [1, 1];
      const matrix = new DOMMatrix(value);
      return [Math.hypot(matrix.a, matrix.b), Math.hypot(matrix.c, matrix.d)];
    };

    window.runRenderingContract = async ({ deviceScaleFactor }) => {
      const checks = [];
      const check = (name, pass, actual, expected) => checks.push({ name, pass, actual, expected });
      const layer = document.querySelector('#cloud-layer');
      const card = document.querySelector('.cm-cloud');
      const strip = document.querySelector('.cm-strip');
      const name = document.querySelector('.cm-name');
      const hubName = document.querySelector('[data-cm-text-role="hub-name"]');
      const fact = document.querySelector('.cm-fact');
      const edge = document.querySelector('.cm-edge-label');
      const detailBoundaries = [0.25, 0.449, 0.45, 0.749, 0.75, 0.999, 1]
        .map(cloudMapDetailLevel);
      check(
        'cloud detail thresholds are stable',
        JSON.stringify(detailBoundaries) === JSON.stringify(['overview', 'overview', 'compact', 'compact', 'condensed', 'condensed', 'full']),
        detailBoundaries,
        ['overview', 'overview', 'compact', 'compact', 'condensed', 'condensed', 'full'],
      );

      for (const zoom of [0.25, 0.265, 0.45, 0.5, 0.749, 0.75, 0.9, 1, 2]) {
        layer.style.setProperty('--cm-z', String(zoom));
        const typeScale = cloudMapTypographyScale(zoom);
        layer.style.setProperty('--cm-type-z', String(typeScale));
        const detailLevel = cloudMapDetailLevel(zoom);
        layer.dataset.cmDetail = 'full';
        edge.style.width = `${96 * zoom}px`;
        await nextFrame();
        const fullDetailHeight = card.getBoundingClientRect().height;
        layer.dataset.cmDetail = detailLevel;
        await nextFrame();
        const expected = {
          cardWidth: 168 * zoom,
          edgeFont: 12 * typeScale,
          factFont: 11 * typeScale,
          nameFont: 13 * typeScale,
          hubNameFont: 15 * typeScale,
        };
        const actual = {
          cardWidth: card.getBoundingClientRect().width,
          edgeFont: pixelValue(edge, 'fontSize'),
          factFont: pixelValue(fact, 'fontSize'),
          nameFont: pixelValue(name, 'fontSize'),
          hubNameFont: pixelValue(hubName, 'fontSize'),
        };
        for (const property of Object.keys(expected)) {
          check(`cloud ${property} at ${zoom}x`, closeTo(actual[property], expected[property]), actual[property], expected[property]);
        }
        check(`cloud detail level at ${zoom}x`, layer.dataset.cmDetail === detailLevel, layer.dataset.cmDetail, detailLevel);
        const expectedVisibility = {
          strip: detailLevel === 'overview' || detailLevel === 'compact' ? 'hidden' : 'visible',
          name: detailLevel === 'overview' ? 'hidden' : 'visible',
          fact: detailLevel === 'full' ? 'visible' : 'hidden',
          edge: detailLevel === 'full' ? 'visible' : 'hidden',
        };
        const actualVisibility = {
          strip: getComputedStyle(strip).visibility,
          name: getComputedStyle(name).visibility,
          fact: getComputedStyle(fact).visibility,
          edge: getComputedStyle(edge).visibility,
        };
        for (const property of Object.keys(expectedVisibility)) {
          check(
            `cloud ${property} visibility at ${zoom}x`,
            actualVisibility[property] === expectedVisibility[property],
            actualVisibility[property],
            expectedVisibility[property],
          );
        }
        const reducedDetailHeight = card.getBoundingClientRect().height;
        check(
          `cloud semantic detail preserves geometry at ${zoom}x`,
          closeTo(reducedDetailHeight, fullDetailHeight, 0.01),
          reducedDetailHeight,
          fullDetailHeight,
        );
        for (const [label, element] of [['layer', layer], ['card', card], ['edge label', edge]]) {
          const scales = transformScale(element);
          check(`${label} has no raster scale at ${zoom}x`, scales.every(scale => closeTo(scale, 1, 0.001)), scales, [1, 1]);
        }
      }

      const text = 'Guide the party through 春天 before the sleeping dragon wakes';
      const options = {
        font: CLOUDMAP_EDGE_LABEL_FONT,
        maxWidth: 96,
        lineHeight: 16,
        letterSpacing: CLOUDMAP_EDGE_LABEL_LETTER_SPACING,
      };
      const first = layoutText(text, options);
      const cached = layoutText(text, options);
      const measuredFontFamily = CLOUDMAP_EDGE_LABEL_FONT.replace(/^\S+\s+/, '');
      edge.replaceChildren(...first.lines.map(line => {
        const span = document.createElement('span');
        span.className = 'cm-edge-label-line';
        span.textContent = line.text;
        return span;
      }));
      check('shared layout result identity is cached', first === cached, first === cached, true);
      check(
        'edge label measurement uses the rendered font stack',
        normalizedFontFamily(getComputedStyle(edge).fontFamily) === normalizedFontFamily(measuredFontFamily),
        getComputedStyle(edge).fontFamily,
        measuredFontFamily,
      );
      check('shared layout produces multiple lines', first.lines.length > 1, first.lines.length, '> 1');
      check(
        'materialized edge lines match shared layout',
        JSON.stringify([...edge.children].map(line => line.textContent)) === JSON.stringify(first.lines.map(line => line.text)),
        [...edge.children].map(line => line.textContent),
        first.lines.map(line => line.text),
      );

      const cardLayout = layoutCloudMapText('Untitled explorer beyond the mountains', {
        role: 'name',
        zoom: 0.5,
        baseWidth: 148,
        maxLines: 2,
      }, layoutText);
      name.replaceChildren(...cardLayout.lines.map(line => {
        const span = document.createElement('span');
        span.className = 'cm-text-line';
        span.textContent = line;
        return span;
      }));
      check('Pretext card wrapping respects its line cap', cardLayout.lines.length <= 2, cardLayout.lines.length, '<= 2');
      check('Pretext card wrapping uses the visible compact width', cardLayout.metrics.maxWidth === 74, cardLayout.metrics.maxWidth, 74);

      const events = [];
      const unsubscribe = onTextLayoutInvalidated(event => events.push(event));
      clearTextLayoutCache('browser-contract');
      const refreshed = layoutText(text, options);
      unsubscribe();
      clearTextLayoutCache('after-unsubscribe');
      check('cache invalidation replaces the result object', refreshed !== first, refreshed === first, false);
      check(
        'mounted listeners receive only subscribed invalidations',
        events.length === 1 && events[0].reason === 'browser-contract',
        events.map(event => event.reason),
        ['browser-contract'],
      );

      return { name: 'host text rendering', checks, diagnostics: { deviceScaleFactor } };
    };
  </script>
</body>
</html>
